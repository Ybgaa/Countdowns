<!--
حط ملف الموسيقى باسم:
music.mp3

في نفس فولدر ملف الـ HTML
-->

<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Countdown</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at top,#111827 0%,#020617 45%,#000 100%);

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:20px;

    overflow-x:hidden;

    position:relative;
}

/* glow */

body::before{

    content:"";

    position:fixed;

    width:450px;
    height:450px;

    background:#00ff88;

    filter:blur(170px);

    opacity:.10;

    border-radius:50%;

    top:-180px;

    left:50%;

    transform:translateX(-50%);
}

/* main card */

.container{

    width:100%;

    max-width:900px;

    margin:auto;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border-radius:32px;

    padding:30px 18px;

    text-align:center;

    box-shadow:
    0 0 40px rgba(0,0,0,.45),
    inset 0 0 20px rgba(255,255,255,.03);

    position:relative;

    z-index:1;
}

.title{

    font-size:clamp(2rem,6vw,3.3rem);

    font-weight:800;

    line-height:1.2;

    margin-bottom:10px;

    background:linear-gradient(to right,#00ff88,#00d9ff);

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;
}

.subtitle{

    color:#cbd5e1;

    margin-bottom:35px;

    font-size:1rem;

    line-height:1.5;
}

/* countdown */

.countdown{

    width:100%;

    display:grid;

    grid-template-columns:repeat(4,minmax(0,1fr));

    gap:15px;
}

.card{

    width:100%;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.07);

    border-radius:24px;

    padding:20px 10px;

    transition:.25s;
}

.card:hover{

    transform:translateY(-4px);

    background:rgba(255,255,255,.08);
}

.number{

    font-size:clamp(2.2rem,7vw,4rem);

    font-weight:800;

    color:#00ff88;

    line-height:1;
}

.label{

    margin-top:10px;

    font-size:.92rem;

    color:#cbd5e1;

    letter-spacing:1px;
}

/* extras */

.extra-box{

    margin-top:25px;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.extra{

    width:100%;

    background:rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;

    padding:15px;

    color:#00ff88;

    font-size:.98rem;

    word-break:break-word;
}

/* footer */

.footer{

    margin-top:25px;

    color:#94a3b8;

    font-size:.9rem;
}

/* music bubble */

.music-btn{

    position:fixed;

    right:18px;

    bottom:18px;

    width:65px;

    height:65px;

    border:none;

    border-radius:50%;

    background:rgba(0,255,136,.14);

    backdrop-filter:blur(12px);

    color:#00ff88;

    font-size:1.4rem;

    cursor:pointer;

    box-shadow:0 0 25px rgba(0,255,136,.22);

    z-index:999;

    transition:.25s;
}

.music-btn:hover{

    transform:scale(1.08);
}

/* mobile */

@media(max-width:700px){

    body{
        padding:14px;
    }

    .container{

        padding:25px 14px;

        border-radius:26px;
    }

    .countdown{

        grid-template-columns:repeat(2,1fr);

        gap:12px;
    }

    .card{

        padding:18px 8px;
    }

    .number{

        font-size:2.7rem;
    }
}

@media(max-width:380px){

    .number{

        font-size:2.2rem;
    }

    .label{

        font-size:.8rem;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        Countdown to 24 May 2026
    </h1>

    <p class="subtitle">
        End of Second Secondary — 1:30 PM
    </p>

    <div class="countdown">

        <div class="card">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="card">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="card">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="card">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="extra-box">

        <div class="extra" id="total-seconds">
            Total Seconds Remaining: 0
        </div>

        <div class="extra" id="total-minutes">
            Total Minutes Remaining: 0
        </div>

        <div class="extra" id="total-hours">
            Total Hours Remaining: 0
        </div>

    </div>

    <div class="footer">
        coded by YUSUF Bassem
    </div>

</div>

<!-- audio -->

<audio id="bgMusic" loop playsinline>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- bubble -->

<button class="music-btn" id="musicBtn">
    🔊
</button>

<script>

const audio = document.getElementById("bgMusic");

const musicBtn = document.getElementById("musicBtn");

let playing = false;

/*
حل مشكلة autoplay في الموبايل
بيشتغل أول interaction مباشرة
*/

const startMusic = async () => {

    if(playing) return;

    try{

        audio.volume = 1;

        await audio.play();

        playing = true;

    }catch(err){

        console.log("Autoplay blocked");
    }
};

/* أول touch أو click */

document.addEventListener("click",startMusic,{once:true});

document.addEventListener("touchstart",startMusic,{once:true});

/* mute */

musicBtn.addEventListener("click",() => {

    if(!playing){

        startMusic();
    }

    audio.muted = !audio.muted;

    musicBtn.innerHTML = audio.muted ? "🔇" : "🔊";
});

/* countdown */

function countdown(){

    const targetDate = new Date("2026-05-25T10:30:00");

    const now = new Date();

    const diff = targetDate - now;

    if(diff <= 0){

        document.body.innerHTML = `
        <div style="
            display:flex;
            justify-content:center;
            align-items:center;
            width:100%;
            min-height:100vh;
            text-align:center;
            font-family:Arial;
            color:white;
        ">
            <h1 style="
                font-size:3rem;
                color:#00ff88;
            ">
                🎉 Time's Up!
            </h1>
        </div>
        `;

        return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const totalMinutes = Math.floor(totalSeconds / 60);

    const totalHours = Math.floor(totalMinutes / 60);

    const days = Math.floor(totalSeconds / (60 * 60 * 24));

    const hours = Math.floor((totalSeconds / (60 * 60)) % 24);

    const minutes = Math.floor((totalSeconds / 60) % 60);

    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;

    document.getElementById("hours").textContent = hours;

    document.getElementById("minutes").textContent = minutes;

    document.getElementById("seconds").textContent = seconds;

    document.getElementById("total-seconds").textContent =
    `Total Seconds Remaining: ${totalSeconds.toLocaleString()}`;

    document.getElementById("total-minutes").textContent =
    `Total Minutes Remaining: ${totalMinutes.toLocaleString()}`;

    document.getElementById("total-hours").textContent =
    `Total Hours Remaining: ${totalHours.toLocaleString()}`;
}

countdown();

setInterval(countdown,1000);

</script>

</body>
</html>
