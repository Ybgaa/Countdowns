<!-- حط ملف الميوزيك باسم music.mp3 جنب ملف الـ HTML -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Countdown</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top,#0f172a 0%, #020617 45%, #000 100%);

    color:white;
    overflow:hidden;
    padding:20px;
}

body::before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    background:#00ff88;
    filter:blur(180px);
    opacity:.12;
    border-radius:50%;
    top:-150px;
}

.container{
    width:100%;
    max-width:950px;

    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(18px);

    border-radius:30px;

    padding:35px 20px;

    text-align:center;

    box-shadow:
    0 0 40px rgba(0,0,0,.5),
    inset 0 0 20px rgba(255,255,255,.03);
}

.title{
    font-size:clamp(1.8rem,5vw,3rem);
    margin-bottom:10px;
    font-weight:700;

    background:linear-gradient(to right,#00ff88,#00d9ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    color:#cbd5e1;
    margin-bottom:35px;
    font-size:1rem;
}

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    border-radius:22px;

    padding:20px 10px;

    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.number{
    font-size:clamp(2rem,6vw,4rem);
    font-weight:bold;
    color:#00ff88;
}

.label{
    margin-top:8px;
    color:#cbd5e1;
    font-size:.95rem;
    letter-spacing:1px;
}

.extra-box{
    margin-top:25px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.extra{
    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.08);

    padding:15px;

    border-radius:18px;

    color:#00ff88;

    font-size:1rem;

    word-break:break-word;
}

.footer{
    margin-top:25px;
    color:#94a3b8;
    font-size:.9rem;
}

/* music bubble */

.music-btn{
    position:fixed;
    right:20px;
    bottom:20px;

    width:65px;
    height:65px;

    border-radius:50%;

    border:none;

    background:rgba(0,255,136,.15);

    backdrop-filter:blur(10px);

    color:#00ff88;

    font-size:1.4rem;

    cursor:pointer;

    box-shadow:0 0 25px rgba(0,255,136,.25);

    transition:.3s;

    z-index:999;
}

.music-btn:hover{
    transform:scale(1.08);
}

@media(max-width:700px){

    .countdown{
        grid-template-columns:repeat(2,1fr);
    }

    .container{
        padding:25px 15px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        Countdown to 24 May 2026
    </h1>

    <p class="subtitle">
        End of Second Secondary — 1:30 PM
    </p>

    <div class="countdown">

        <div class="card">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="card">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="card">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="card">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <div class="extra-box">

        <div class="extra" id="total-seconds">
            Total Seconds Remaining: 0
        </div>

        <div class="extra" id="total-minutes">
            Total Minutes Remaining: 0
        </div>

        <div class="extra" id="total-hours">
            Total Hours Remaining: 0
        </div>

    </div>

    <div class="footer">
        coded by Yusuf
    </div>

</div>

<!-- audio -->
<audio id="bg-music" autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- music bubble -->
<button class="music-btn" id="music-btn">
    🔊
</button>

<script>

const audio = document.getElementById("bg-music");
const musicBtn = document.getElementById("music-btn");

let isMuted = false;

/* autoplay محاولة */
window.addEventListener("load", () => {

    const playPromise = audio.play();

    if(playPromise !== undefined){
        playPromise.catch(() => {

            // بعض الموبايلات تمنع autoplay
            document.body.addEventListener("click", () => {
                audio.play();
            }, { once:true });

        });
    }

});

/* mute/unmute */

musicBtn.addEventListener("click", () => {

    isMuted = !isMuted;

    audio.muted = isMuted;

    musicBtn.innerHTML = isMuted ? "🔇" : "🔊";

});

const countdown = () => {

    const targetDate = new Date("2026-05-24T13:30:00");

    const now = new Date();

    const diff = targetDate - now;

    if(diff <= 0){

        document.body.innerHTML = `
        <div style="
        color:white;
        font-family:Arial;
        text-align:center;
        ">
            <h1 style="
            font-size:3rem;
            color:#00ff88;
            ">
                🎉 Time's up!
            </h1>
        </div>
        `;

        return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const totalMinutes = Math.floor(totalSeconds / 60);

    const totalHours = Math.floor(totalMinutes / 60);

    const days = Math.floor(totalSeconds / (60 * 60 * 24));

    const hours = Math.floor((totalSeconds / (60 * 60)) % 24);

    const minutes = Math.floor((totalSeconds / 60) % 60);

    const seconds = totalSeconds % 60;

    document.getElementById("days").textContent = days;

    document.getElementById("hours").textContent = hours;

    document.getElementById("minutes").textContent = minutes;

    document.getElementById("seconds").textContent = seconds;

    document.getElementById("total-seconds").textContent =
    `Total Seconds Remaining: ${totalSeconds.toLocaleString()}`;

    document.getElementById("total-minutes").textContent =
    `Total Minutes Remaining: ${totalMinutes.toLocaleString()}`;

    document.getElementById("total-hours").textContent =
    `Total Hours Remaining: ${totalHours.toLocaleString()}`;

};

setInterval(countdown,1000);

countdown();

</script>

</body>
</html>
