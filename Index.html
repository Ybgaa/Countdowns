<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Countdown to 21 Jan 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: black ;
      color: #0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 40px;
    }
    .countdown {
      font-size: 2rem;
      display: flex;
      gap: 20px;
    }
    .time {
      text-align: center;
    }
    .number {
      font-size: 3rem;
    }
    .total-seconds {
      margin-top: 30px;
      font-size: 1.5rem;
      color: #0f0;
    }
  </style>
</head>
<body>
  <h1>Countdown to 24 May 2026, 1:30 PM </h1>
  <h1> End of second secondery </h1>
  <div class="countdown">
    <div class="time">
      <div class="number" id="days">0</div>
      <div>Days</div>
    </div>
    <div class="time">
      <div class="number" id="hours">0</div>
      <div>Hours</div>
    </div>
    <div class="time">
      <div class="number" id="minutes">0</div>
      <div>Minutes</div>
    </div>
    <div class="time">
      <div class="number" id="seconds">0</div>
      <div>Seconds</div>
    </div>
  </div>

  <div class="total-seconds" id="total-seconds">
    Total Seconds Remaining: 0
  </div>

  <script>
    const countdown = () => {
      const targetDate = new Date("2026-05-24T13:30:00");
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.body.innerHTML = "<h1>Time's up!</h1>";
        return;
      }

      const totalSeconds = Math.floor(diff / 1000);
      const days = Math.floor(totalSeconds / (60 * 60 * 24));
      const hours = Math.floor((totalSeconds / (60 * 60)) % 24);
      const minutes = Math.floor((totalSeconds / 60) % 60);
      const seconds = totalSeconds % 60;

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = hours;
      document.getElementById("minutes").textContent = minutes;
      document.getElementById("seconds").textContent = seconds;
      document.getElementById("total-seconds").textContent = 
        `Total Seconds Remaining: ${totalSeconds}`;
    };

    setInterval(countdown, 1000);
    countdown(); // initial call
  </script>
  <h4>coded by Yusuf </h4>
</body>
</html>
